# AutoHealth configuration

llm:
  # ========== 主模型（文本任务）：DeepSeek Chat ==========
  api_key: ""
  base_url: ""
  model: "deepseek-chat"
  temperature: 0.7
  top_p: 0.7
  max_tokens: 8192
  extra: {}

  # ========== 视觉模型：GLM-4v ==========
  vision_api_key: ""
  vision_base_url: ""
  vision_model: "glm-4.6v"
  vision_temperature: 0.2
  vision_top_p: 0.9
  vision_max_tokens: 1200

execution:
  conda_env: "automl"
  timeout_seconds: 1200

agent:
  max_iterations: 15
  max_observation_chars: 10000

# 支持每个智能体单独配置（覆盖上方默认值）
# 例如：为数据理解智能体单独设置温度/采样等
agents:
  data_understanding:
    llm:
      temperature: 0.3
      top_p: 0.3
      max_tokens: 8192
      extra: {}
    execution: {}
    agent:
      max_iterations: 10
  planning:
    llm:
      temperature: 0.4
      top_p: 0.7
      max_tokens: 8192
      extra: {}
    execution: {}
    agent:
      # 计划者↔评价者 的迭代轮数（每轮包含：评价者反问 + 计划者改写）
      review_rounds: 2
      # 信息增强检索开关（Kaggle API）
      enable_retrieval: false
      enable_kaggle_retrieval: false
      enable_arxiv_retrieval: false
      enable_web_retrieval: false
      kaggle_top_k: 10
      kaggle_language: "python"
      kaggle_sort_by: "relevance"
      arxiv_top_k: 5
      web_top_k: 5
      web_search_url: "https://duckduckgo.com/html/?q={query}"
      # 控制上下文规模（字符数）
      max_chars_data_report: 20000
      max_chars_feedback: 8000
      max_chars_kaggle_context: 40000
      max_chars_notebook: 20000
      # 不确定性方法融入开关
      enable_uncertainty: true
      # 可选：不确定性方法清单路径；不填则默认查找项目根目录下“不确定性方法.md”
      uncertainty_methods_path: ""
  code_execution:
    llm:
      temperature: 0.3
      top_p: 0.3 
      max_tokens: 8192
      extra: {}
    execution: {}
    agent:
      max_stage_retries: 5
      max_retries: 10
      max_observation_chars: 30000
      max_steps: 15

  model_test:
    llm:
      # 视觉解释偏向稳定、少幻觉
      vision_temperature: 0.2
      vision_top_p: 0.9
      vision_max_tokens: 1200
      extra: {}
    execution: {}
    agent:
      max_rows_for_data_plots: 200000
      sample_rows_for_distributions: 20000
      max_plots_to_explain: 20
    
