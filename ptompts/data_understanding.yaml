iterative_step_prompt: |-
  **【迭代式深度探索】** 你正在进行第 {current_iteration}/{max_iterations} 轮的迭代式数据探索。

  ## 任务描述
  {task_description}

  ## 上一次的数据分析报告

  以下是之前完成的数据分析报告，请在此基础上进行更深入的探索：

  ```markdown
  {previous_report}
  ```

  ## 本次探索的额外要求

  {additional_requirements}

  ## 当前探索历史

  {history_summary}

  ## 本轮探索指引

  基于上一次的报告，你需要：
  - **针对性深入**：围绕额外要求中提到的问题进行针对性分析
  - **补充遗漏**：如果上次报告有不够详细的地方，进行补充探索
  - **验证假设**：对上次报告中的发现进行验证或深入分析
  - **新角度分析**：从不同角度（时间、空间、子群体等）重新审视数据

  **记住**：
  - 每轮代码要全面，尽量一次性覆盖多个相关维度
  - 只打印关键必要信息，避免冗余输出
  - 先用1-2句话说明本轮探索目的，然后输出完整的 Python 代码块
  - **必须二选一**：只输出 A) 或 B)，禁止同时输出代码和报告

  ## 输出格式（二选一）

  **A) 继续探索：**

  [1-2句话说明本轮探索目的]

  ```python
  # 针对额外要求的深度探索代码（只输出关键信息）
  import pandas as pd
  import numpy as np
  # ...
  ```

  **B) 收敛结束（只在信息已足够时使用）：**

  程序结束OVER

  ```Data_Analysis_Report
  迭代式数据分析报告
  ============

  上次报告回顾
  （简要总结上次报告的关键发现）

  本次深度探索结果
  （针对额外要求的详细分析结果）

  数据存储结构与加载方式
  （文字说明每个文件/目录如何存储数据、字段含义与对应关系）
  加载示例代码（必须提供，直接写代码文本，不要使用代码块标记）：
  例如：
  import pandas as pd
  train = pd.read_csv("/path/to/train.csv")
  # ...

  更新的建模建议
  （基于新发现更新的建议）
  ```

