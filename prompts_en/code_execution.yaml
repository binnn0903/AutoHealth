debug_prompt: |-
  # Debug Mode

  # Task Description
  {task_description}

  # Data Exploration Report
  {data_report}

  # Training Plan
  {plan_markdown}

  # Device Information
  {device_info}

  ## Current Debug Position
  Currently at Step {current_step_no}, debug attempt {debug_attempt_index}/{debug_attempt_total}.

  ## Debug Mechanism
  - Successful step range: {successful_step_range} (that is, the successful steps before the current Step {current_step_no})
  - Successful outputs / code are provided only for variable reuse; do not execute them again. They correspond to the successful code from Steps 1..{current_step_no_minus_one}
  - The failed step is the current Step {current_step_no}; only rewrite the failed code for this round

  ## Successfully Executed (all successful steps)
  {successful_executions}

  Outputs (successful steps)
  ```
  {successful_outputs}
  ```

  Code (successful steps)
  ```python
  {successful_codes}
  ```

  Note: the above "outputs / code" are the aggregated content of **all successful steps**, concatenated in step order.

  ## Failed Step in This Round (please rewrite this round's code)
  Execution content:
  {last_execution_content}

  Output (failed step)
  ```
  {last_failed_output}
  ```

  Code (failed step)
  ```python
  {last_code}
  ```

  Error message (failed step)
  ```
  {error_message}
  ```

  Error history (accumulated for this step)
  ```
  {error_history}
  ```

  ## Your Task
  Fix only the code for the current failed step; do not repeat successful steps.
  Variables from the failed step cannot be reused. Try to use variables already defined in successful steps; if uncertain, first check whether the variable exists or reload it from file.
  For GPU tasks, during debugging you should check whether GPU memory has been released when appropriate (for example, query current memory usage or cache state in the code, and avoid continuous memory growth). Note that cleaning GPU memory may invalidate dependent GPU tensors, so make sure critical variables still exist or reload them.

  ## Output Format (only these three blocks)

  ```Execution Content
  The purpose of the code you are executing this time (including the main fix points)
  ```

  ```python
  The corrected code
  ```

  ```Status
  CONTINUE/FINISH
  ```

  Please follow the above format strictly, and output only one python code block.

