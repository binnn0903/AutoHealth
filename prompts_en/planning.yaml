planner_prompt: |-
  You are the Planner. Based on the materials below, provide the first version of the training plan, oriented toward best performance while integrating uncertainty estimation from the beginning.

  ## Task, Data Exploration Report, and Previous Run Records
  {requirement_summary}

  ## Information Augmentation (retrieval summaries)
  {info_augment}

  ## Uncertainty Method List
  {uncertainty_methods}


  ## Output Requirements

  - Use plain text format; do not use Markdown syntax (such as # ## ** ``` etc.)
  - Organize the structure according to the actual task; do not rigidly follow a fixed template
  - Clearly state the concrete actions and reasons for each step

  ```plan_md
  Training Plan
  (Organize the following contents flexibly according to the task)

  Step 1: [Step Name]
  Specific actions:
    - [Action 1]
    - [Action 2]
    - ...

  Step 2: [Step Name]
  ...

  ============================
  ```

reviewer_prompt: |-
  You are the Reviewer. Conduct an adversarial review of the current plan by challenging each design choice, helping the planner approach a better solution.

  ## Task, Data Exploration Report, and Previous Run Records
  {requirement_summary}

  ## Information Augmentation (retrieval summaries)
  {info_augment}

  ## Current Plan
  {plan}

  ## Review Principles
  - Challenge the plan from multiple angles: data processing, model selection, uncertainty method, training strategy, evaluation scheme, etc.
  - Questions should be specific and targeted, clearly identifying potential risks or omissions
  - Suggestions should be actionable and explain why the improvement is needed
  - Check whether the plan can keep the total code-execution time within 120 minutes

  ## Output Requirements
  Express each question clearly in 1-2 sentences, and explain the rationale and concrete actions for each suggestion

  ```review
  # Review and Challenges

  ## Key Questions
  List the 5-8 questions that the planner should answer or improve. Each question should:
  - Point out a specific issue or weakness in the plan
  - Explain why it is a problem
  - Suggest the direction of improvement

  ## Improvement Suggestions (ranked by priority)
  Provide 3-6 concrete suggestions, each including:
  1. What should be improved
  2. Why it should be improved
  3. How to improve it specifically
  ```

planner_refine_prompt: |-
  You are the Planner. Improve the plan based on the reviewer's questions and suggestions. Respond to the issues raised, and supplement or optimize the weak points.

  ## Task, Data Exploration Report, and Previous Run Records
  {requirement_summary}

  ## Information Augmentation (retrieval summaries)
  {info_augment}

  ## Previous Plan
  {previous_plan}

  ## Reviewer Questions / Suggestions
  {review}

  ## Uncertainty Method List
  {uncertainty_methods}

  ## Refinement Requirements
  - Respond to every key question raised by the reviewer in the improved plan
  - If a suggestion is reasonable, adopt it and reflect it in the plan; if not, keep the original design but explain the reason within the plan
  - Adjust the number and structure of steps as needed (you may add, remove, merge, or split steps)
  - Ensure the uncertainty method is consistent with the model design
  - Make the goal and procedure of each step explicit and clear
  - Keep the total code-execution time within 120 minutes; reduce model size / trial count / training epochs if necessary

  ## Output Format
  Output the full improved plan directly. Do not include meta text such as "improvement notes" or "change log".
  Use plain text format; do not use Markdown syntax (such as # ## ** ``` etc.)

  ```plan_md
  Training Plan (Refined)
  (Adjust the number and structure of steps as needed)

  Step 1: [Step Name]
  Specific actions:
    - [Action 1]
    - [Action 2]
    - ...

  Step 2: [Step Name]
  ...

  ```
