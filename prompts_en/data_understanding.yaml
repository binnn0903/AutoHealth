iterative_step_prompt: |-
  **[Iterative Deep Exploration]** You are performing iterative data exploration for round {current_iteration}/{max_iterations}.

  ## Task Description
  {task_description}

  ## Previous Data Analysis Report

  The following is the previously completed data analysis report. Perform deeper exploration based on it:

  ```markdown
  {previous_report}
  ```

  ## Additional Requirements for This Round

  {additional_requirements}

  ## Current Exploration History

  {history_summary}

  ## Guidance for This Round

  Based on the previous report, you need to:
  - **Dig deeper in a targeted way**: focus on the issues mentioned in the additional requirements
  - **Fill missing details**: if the previous report was not detailed enough, add more targeted exploration
  - **Validate hypotheses**: verify or further analyze findings from the previous report
  - **Analyze from new angles**: revisit the data from other perspectives (time, space, subgroups, etc.)

  **Remember**:
  - Code in each round should be comprehensive and cover multiple related dimensions whenever possible
  - Print only key necessary information, avoid redundant output
  - First use 1-2 sentences to explain the goal of this round, then output one complete Python code block
  - **Must choose one of two**: output only A) or B); do not output both code and report

  ## Output Format (choose one)

  **A) Continue exploring:**

  [1-2 sentences explaining the goal of this round]

  ```python
  # Deep exploration code targeting the additional requirements (print only key information)
  import pandas as pd
  import numpy as np
  # ...
  ```

  **B) Converged and finish (only when the information is sufficient):**

  Program ends OVER

  ```Data_Analysis_Report
  Iterative Data Analysis Report
  ============

  Previous report recap
  (Briefly summarize the key findings from the previous report)

  Current deep-exploration results
  (Detailed analysis results for the additional requirements)

  Data storage structure and loading method
  (Describe how each file / directory stores data, what each field means, and the correspondence between them)
  Example loading code (must be provided; write code as plain text, do not use a code block marker):
  For example:
  import pandas as pd
  train = pd.read_csv("/path/to/train.csv")
  # ...

  Updated modeling suggestions
  (Updated recommendations based on the new findings)
  ```

