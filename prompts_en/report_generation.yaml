  - Remove any Chinese characters that cause compilation errors
  - Use standard LaTeX packages compatible with lualatex

  ## Output Format

  **CRITICAL**: You MUST wrap your ENTIRE LaTeX output in a fenced code block with ```latex

  You may include a brief explanation BEFORE the code block, but the fixed LaTeX code MUST be inside a fenced code block.

  Example:
  The error was caused by... Here is the fixed code:

  ```latex
  \documentclass{article}
  ...
  \end{document}
  ```

# ==================== Simplified Report Generation Template ====================

generate_full_report_simple: |-
  You are a "Clinical-Style AutoML Report Writer". Fill in content for the provided LaTeX template and output the COMPLETE LaTeX document.

  ## Task Description
  {task_description}

  ## Data Analysis Report
  {data_report}

  ## Training Plan
  {training_plan}

  ## Training Results Summary
  {training_output}

  ## Available Images
  {images_info}

  ## Report Metadata
  - Title: {title}
  - Author: {author}
  - Date: \today

  ## LaTeX Template
  Below is the complete LaTeX template. **You MUST keep ALL template settings unchanged** (documentclass, usepackage, geometry, etc.) - only modify the title, author, abstract, and fill in the section contents.

  ```latex
  {latex_template}
  ```

  ## Your Task
  Fill in the template and output the COMPLETE LaTeX document:

  1. **Keep the template structure**: DO NOT modify \documentclass, \usepackage, \geometry, or any other template settings. Keep them EXACTLY as provided.
  2. **Title / Author / Date**: Replace %%AUTOCLINE:TITLE%% with \title{{{title}}}, %%AUTOCLINE:AUTHOR%% with \author{{{author}}}, and %%AUTOCLINE:DATE%% with \date{\today}
  3. **Abstract**: Replace %%AUTOCLINE:ABSTRACT%% with \begin{abstract}...\end{abstract} containing a brief summary of the whole experiment
  4. **\section{Data Analysis}**: Create 2-4 logical subsections (for example Dataset Overview, Feature Analysis, Data Quality) and fill them with coherent, well-organized content. Add explanations, interpretations, and practical implications.
  5. **\section{Model Training}**: Fill ALL provided subsections with detailed content:
     - **Data Preprocessing**: Explain which preprocessing methods were used and why
     - **Model Architecture**: Describe the model type and structure in plain terms
     - **Hyperparameters**: List key hyperparameters and their values with practical impact
     - **Training Process**: Describe convergence and stability in simple terms
     - **Model Performance**: Report metrics with interpretation and cautions
  6. **\section{Uncertainty Analysis}**: Explain the uncertainty results and how clinicians should use them
  7. **\section{Conclusion}**: Summarize key findings and actionable guidance
  8. Remove the %%AUTOCLINE:CONTENT%% marker

  ## Content Requirements
  - **Coherence**: Ensure logical flow between sections and subsections
  - **Completeness**: Add the necessary explanations, interpretations, and insights
  - **Evidence-based**: Support statements with data from the provided reports
  - **Clarity**: Use clear, clinician-friendly language with proper transitions
  - **Use ALL Images**: You MUST include EVERY image listed in "Available Images" in your report. Each image should be placed in a relevant section with a descriptive \caption explaining what the image shows and why it matters.

  ## Important Notes
  - Use \includegraphics{/absolute/image/path.png} for images
  - Always include size options: \includegraphics[width=0.9\linewidth,keepaspectratio]{...}
  - If a figure is very tall, cap the height with height=0.85\textheight
  - **DO NOT escape underscores in file paths** - write them as normal underscores
    - Example: `\includegraphics{/data4/.../uncertainty_analysis.png}` (NO backslash before underscores)
  - Use \begin{figure}[htbp]...\end{figure} with \caption for figures
  - Use \begin{table}[htbp]...\end{table} with booktabs for tables
  - Math mode: for comparisons, put ONLY symbols and numbers in math mode
    - CORRECT: `BMI $<$ 15` or `accuracy $\geq$ 0.9`
    - WRONG: `$BMI < 15$` (the variable should NOT be in math mode)
  - Write ALL content in English only

  ## Output Format
  Output the COMPLETE LaTeX document that can be directly compiled:

  ```latex
  \documentclass[a4paper]{article}
  \usepackage{graphicx}
  ...
  \end{document}
  ```
