fix_latex_error: |-
  # LaTeX Compilation Error

  You need to fix the following LaTeX compilation error.

  ## Error Message
  ```
  {error_message}
  ```

  ## Original LaTeX Code
  ```latex
  {latex_code}
  ```

  ## Your Task

  Analyze the error cause and output the fixed complete LaTeX code.

  ## Common Error Types and Fixes

  1. **Table errors**: Check whether \hline, \toprule, and \bottomrule are paired properly
  2. **Math mode errors (CRITICAL)**:
     - For comparison expressions: put ONLY numbers and symbols in math mode, keep variable names OUTSIDE
     - **CORRECT**: `BMI $<$ 15` or `p $\leq$ 0.05` or `R$^2$ = 0.85`
     - **WRONG**: `$BMI < 15$` - variable name should NOT be in math mode
     - **WRONG**: `$<$ 15` - the number should also be in math mode
     - **WRONG**: `$< 15` or `$\leq 0.1$` - unclosed math mode
     - Rule: Variable names are TEXT, only operators / numbers belong inside $...$
     - Examples: "accuracy $\geq$ 0.9", "difference $\leq$ 0.1"
  3. **Unclosed environments**: Check whether \begin{...} and \end{...} are properly paired
  4. **Special characters**: Use \&, \%, \$, \#, \_, \{, \} to escape them
  5. **Figure paths**: Check whether \includegraphics file paths are correct
  6. **Chinese characters**: Remove any Chinese characters, use English only

  ## IMPORTANT
  - **All content must be in English only**
  - Remove any Chinese characters that cause compilation errors
  - Translate to English if necessary

  ## Output Format

  **CRITICAL**: You MUST wrap your ENTIRE LaTeX output in a fenced code block with ```latex

  ```latex
  \documentclass{article}
  ...
  \end{document}
  ```

  Do NOT include any explanatory text outside the code block. Output ONLY the fixed LaTeX code inside the fenced block.

