debug_prompt: |-
  # Debug Mode

  # Task Description
  {task_description}

  # Data Exploration Report
  {data_report}

  # Training Plan
  {plan_markdown}

  ## Summary of Completed Steps (successful steps only)
  {completed_work_summary}

  ## Last Successfully Executed Step
  {last_successful_execution}

  ## Code from the Last Successful Step (variables may be reused)
  ```python
  {last_successful_code}
  ```

  ## Previous Execution Content
  {last_execution_content}

  ## Previous Step Code
  ```python
  {last_code}
  ```

  ## Execution Error Message
  ```
  {error_message}
  ```

  ## Failure History for This Step (including code and errors)
  {failed_attempts}

  ## Your Task
  Analyze the cause of the error and **only correct the code for the current failed step** before outputting it again.
  - Do not repeat successful steps
  - You may reuse variables from the last successful step, but only if they were actually assigned in successful execution; if uncertain, first check whether the variable exists or reload it from file

  ## Common Error-Fixing Hints
  - **KeyError: 'rmse' / 'l2' or other missing keys**:
    - Do not directly access `model.best_score['val']['rmse']`, because the metric name may differ
    - Correct approach: print `model.best_score` first to inspect the actual structure, then use `.get()`
    - Example: `val_score = model.best_score.get('val', {})`, then `metric_value = list(val_score.values())[0] if val_score else None`

  - **KeyError: other dictionary keys**:
    - Always use `.get()` to access dictionary values: `value = some_dict.get('key', default_value)`

  - **TypeError: Object of type int64/float64 is not JSON serializable**:
    - Use `safe_json_serialize(data, filepath)`

  - **LightGBM callback errors**:
    - Check whether the callback parameters are in the correct format

  ## Output Format

  ```Execution Content
  What this execution does and how it fixes the issue
  ```

  ```python
  # Corrected code
  ```

  ```Status
  CONTINUE/FINISH
  ```

  Please follow the above format strictly (only these three blocks, and only one python code block is allowed).

dependencies_prompt: |-
  Before executing code, first check which Python dependencies need to be installed.

  ## Libraries expected by the current plan
  (Infer the likely libraries from the training plan)

  ## Output Format

  If dependencies need to be installed, output:
  ```bash
  pip install package1 package2
  ```

  If no dependencies are needed, output:
  ```bash
  # No new dependencies needed
  ```
